[package]
name = "gaming"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gaming"

[lib]
name = "game"
path = "src/game/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies.windows]
version = "0.51"
optional = true

features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio_DirectSound",
    "Win32_System_Performance",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Ioctl",
    "Win32_Graphics_Gdi",
]

[features]
# Features in default are enabled, others are disabled.
default = ["gaming_slow", "gaming_internal", "os"]
gaming_internal = []
gaming_slow = []

# Will build dependencies for the os specified here.
os = ["windows"]
